# lefthook.yml
no_tty: true
output:
  - failure

pre-commit:
  parallel: false
  commands:
    formatting:
      glob: "*.rs"
      run: just fmt

commit-msg:
  scripts:
    issue-trailer.sh:
      runner: bash
      args: '"{1}"'

pre-push:
  parallel: false
  piped: true
  jobs:
    - name: issue-and-dependency
      script: issue-and-dependency.sh
      runner: bash
      use_stdin: true
    - name: check-strict
      script: check-strict.sh
      runner: bash

post-merge:
  scripts:
    release-cleanup.sh:
      runner: bash
