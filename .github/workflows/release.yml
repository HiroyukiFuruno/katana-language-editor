name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v0.1.0. Defaults to Cargo.toml version."
        required: false
        type: string
      publish_crates:
        description: "Publish workspace crates to crates.io and run completion audits. Manual releases with false are rejected before mutation."
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/v')
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: katana-language-editor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: katana-language-editor
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0

      - name: Checkout katana-ui-core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HiroyukiFuruno/katana-ui-core
          ref: v0.3.11
          path: katana-ui-core

      - name: Checkout fixed KatanA reference
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HiroyukiFuruno/KatanA
          ref: 4f6a6287c650a38633c7baeb544a92e739c68567
          path: katana

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ubuntu-stable-publish

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Resolve version
        id: version
        run: |
          bash scripts/release/resolve-release-version.sh \
            "${{ github.event_name }}" \
            "${{ inputs.version }}" \
            "${{ github.event.pull_request.head.ref }}"

      - name: Reject partial manual release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_crates != true
        run: |
          echo "workflow_dispatch releases must publish crates and run completion audits. Use release-preflight for dry runs." >&2
          exit 1

      - name: Release check
        env:
          GH_TOKEN: ${{ github.token }}
        run: just VERSION="${{ steps.version.outputs.version }}" release-check

      - name: Create release tag
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "refs/tags/${TAG}")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "Tag ${TAG} already exists but does not point to current HEAD." >&2
              echo "tag_commit=${tag_commit}" >&2
              echo "head_commit=${head_commit}" >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists and points to current HEAD."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --latest --verify-tag
          else
            gh release create "${TAG}" --verify-tag --latest --generate-notes
          fi
      - name: Publish crates.io
        if: github.event_name == 'pull_request' || inputs.publish_crates == true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/release/publish-crates.sh "${{ steps.version.outputs.version }}"
      - name: Verify public release completion
        if: github.event_name == 'pull_request' || inputs.publish_crates == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: just VERSION="${{ steps.version.outputs.version }}" release-completion-audit
