name: CI

on:
  push:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'lefthook.yml'
      - 'clippy.toml'
      - 'assets/**'
      - '.agent/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'
  pull_request:
    branches: [master]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Justfile'
      - 'lefthook.yml'
      - 'clippy.toml'
      - 'assets/**'
      - '.agent/**'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/prompts/**'
      - '.github/skills/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'openspec/**'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and Build
    # WHY: PR 側で通過済みの merge commit では二重実行せず、直接 push は検証する。
    if: >-
      github.event_name != 'push' || (
        !startsWith(github.event.head_commit.message, 'Merge pull request ') &&
        !contains(github.event.head_commit.message, '(#')
      )
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}-stable-default

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Check types
        run: just check-types

      - name: Check formatting
        if: matrix.os != 'windows-latest'
        run: just fmt-check

      - name: Run Windows format check
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      - name: Run linter
        if: matrix.os != 'windows-latest'
        run: just lint

      - name: Run AST linter
        if: matrix.os != 'windows-latest'
        run: just ast-lint

      - name: Run tests
        run: just unit-test

      - name: Run coverage
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: just coverage
