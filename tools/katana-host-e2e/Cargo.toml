[package]
name = "katana-host-e2e"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/HiroyukiFuruno/katana-language-editor"
rust-version = "1.95.0"
publish = false

[workspace]

[features]
default = []
fixed-host = []

[lib]
name = "katana_host_e2e_fixed"

[dependencies]
eframe36 = { package = "eframe", version = "0.36" }
accesskit = "0.24"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
core-graphics = "0.25.0"
